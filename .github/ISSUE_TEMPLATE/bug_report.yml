name: Bug report
description: Report a reproducible Kyma or tooling problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please search existing issues and remove secrets or personal data from examples.
  - type: input
    id: version
    attributes:
      label: Kyma version
      placeholder: "0.2.2 or commit SHA"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest .ky program and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
